<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EGGARO · Prueba 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#78c95a;font-family:Arial,sans-serif}
#game{position:fixed;inset:0}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;z-index:5;pointer-events:none}
.panel{background:#10251ddd;color:#fff;border:1px solid #ffffff35;border-radius:14px;padding:9px 12px;font-weight:800;box-shadow:0 5px 18px #0003}
#select{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:8;display:flex;gap:7px}
#select button,#actions button{border:0;border-radius:14px;padding:11px 14px;background:#ffd34f;color:#50360a;font-weight:1000;box-shadow:0 4px 0 #a56e15;touch-action:manipulation}
#select button.active{background:#fff}
#actions{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:8;display:grid;grid-template-columns:repeat(3,62px);gap:8px}
#actions button{font-size:19px;padding:13px 8px}
#actions #act{grid-column:2/4;width:132px;font-size:14px}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#78c95a;z-index:20;color:#fff;font-size:20px;font-weight:900}
.small{opacity:.75;font-size:12px}
@media(min-width:800px){#actions{display:none}}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading">🌱 Preparando prueba 3D…</div>
<div id="hud">
  <div class="panel" id="status">🌳 Árbol de prueba · 100 resistencia</div>
  <div class="panel" id="character">🐔 Selección: —</div>
</div>
<div id="select">
  <button id="mike">Mike</button>
  <button id="micaela">Micaela</button>
</div>
<div id="actions">
  <button data-key="a">◀</button><button data-key="w">▲</button><button data-key="d">▶</button>
  <button data-key="s">▼</button><button id="act">🌳 PROBAR ÁRBOL</button>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const root=document.getElementById('game');
const loading=document.getElementById('loading');
const status=document.getElementById('status');
const characterLabel=document.getElementById('character');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x86cf63);
scene.fog=new THREE.Fog(0x86cf63,35,110);

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,300);
camera.position.set(0,7,12);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x557744,2.1));
const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(12,20,8);sun.castShadow=true;scene.add(sun);

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(180,180),
 new THREE.MeshStandardMaterial({color:0x67ad4d,roughness:1})
);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

const path=new THREE.Mesh(
 new THREE.PlaneGeometry(9,180),
 new THREE.MeshStandardMaterial({color:0xb88954,roughness:1})
);
path.rotation.x=-Math.PI/2;path.position.y=.01;scene.add(path);

const loader=new GLTFLoader();
const MODELS={
 treeA:'./assets/trees/eggaro-tree-a.glb',
 treeB:'./assets/trees/eggaro-tree-b.glb',
 Mike:'./assets/characters/mike-optimized.glb',
 Micaela:'./assets/characters/micaela-optimized.glb'
};

let player,tree;
let selected=localStorage.getItem('gamerpro_personaje')||new URLSearchParams(location.search).get('personaje')||'Micaela';
if(!['Mike','Micaela'].includes(selected))selected='Micaela';

const playerState={x:0,z:8,speed:4};
const treeState={resistance:100,maxResistance:100,alive:true};
const keys={};

function setStatus(t){status.textContent=t}
function setSelection(name){selected=name;localStorage.setItem('gamerpro_personaje',name);characterLabel.textContent='🐔 Selección: '+name;document.getElementById(name.toLowerCase()).classList.add('active');for(const n of ['mike','micaela'])if(n!==name.toLowerCase())document.getElementById(n).classList.remove('active');loadCharacter()}
document.getElementById('mike').onclick=()=>setSelection('Mike');
document.getElementById('micaela').onclick=()=>setSelection('Micaela');
characterLabel.textContent='🐔 Selección: '+selected;
document.getElementById(selected.toLowerCase()).classList.add('active');

async function loadModel(path){
 const gltf=await loader.loadAsync(path);
 const obj=gltf.scene;
 obj.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
 return obj;
}

async function loadCharacter(){
 if(player)scene.remove(player);
 try{
  player=await loadModel(MODELS[selected]);
  player.position.set(playerState.x,0,playerState.z);
  player.scale.setScalar(1.5);
  scene.add(player);
  characterLabel.textContent='🐔 Selección: '+selected;
 }catch(e){setStatus('⚠️ No se pudo cargar '+selected)}
}

async function loadTree(){
 tree=await loadModel(MODELS.treeA);
 tree.position.set(0,0,0);
 tree.scale.setScalar(2.2);
 scene.add(tree);
}

function nearTree(){return treeState.alive && Math.hypot(playerState.x,playerState.z)<4.5}

function testTree(){
 if(!nearTree()){setStatus('🌳 Acércate al árbol de prueba');return}
 treeState.resistance=Math.max(0,treeState.resistance-10);
 if(treeState.resistance>0){
  setStatus('🌳 Árbol · resistencia '+treeState.resistance+'/100');
  tree.rotation.z=.045;
  setTimeout(()=>{if(tree)tree.rotation.z=0},100);
 }else{
  treeState.alive=false;
  tree.visible=false;
  setStatus('🪵 ¡Prueba completada! El árbol cayó');
 }
}

document.getElementById('act').onclick=testTree;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')testTree()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
for(const b of document.querySelectorAll('[data-key]')){
 const k=b.dataset.key;
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false));
}

function move(dt){
 if(!player)return;
 let x=0,z=0;
 if(keys.a||keys.arrowleft)x--;
 if(keys.d||keys.arrowright)x++;
 if(keys.w||keys.arrowup)z--;
 if(keys.s||keys.arrowdown)z++;
 if(!x&&!z)return;
 const l=Math.hypot(x,z);x/=l;z/=l;
 playerState.x+=x*playerState.speed*dt;
 playerState.z+=z*playerState.speed*dt;
 player.position.x=playerState.x;player.position.z=playerState.z;
}

let last=performance.now();
function animate(now){
 const dt=Math.min((now-last)/1000,.05);last=now;
 move(dt);
 if(player){
  const target=new THREE.Vector3(player.position.x,player.position.y+2.2,player.position.z);
  const desired=new THREE.Vector3(player.position.x,6.5,player.position.z+11);
  camera.position.lerp(desired,1-Math.pow(.001,dt));
  camera.lookAt(target);
 }
 renderer.render(scene,camera);
 requestAnimationFrame(animate);
}

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
(async()=>{
 try{
  await loadTree();
  await loadCharacter();
  loading.style.display='none';
  setStatus('🌳 Árbol de prueba · resistencia 100');
 }catch(e){
  loading.textContent='⚠️ Error cargando los modelos 3D';
  console.error(e);
 }
 requestAnimationFrame(animate);
})();
</script>
</body>
</html>
