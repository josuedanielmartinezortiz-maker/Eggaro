<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EGGARO · Prueba 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#78c95a;font-family:Arial,sans-serif}
#game{position:fixed;inset:0}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;z-index:5;pointer-events:none}
.panel{background:#10251ddd;color:#fff;border:1px solid #ffffff35;border-radius:14px;padding:9px 12px;font-weight:800;box-shadow:0 5px 18px #0003}
#select{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:8;display:flex;gap:7px}
#select button,#actions button{border:0;border-radius:14px;padding:11px 14px;background:#ffd34f;color:#50360a;font-weight:1000;box-shadow:0 4px 0 #a56e15;touch-action:manipulation}
#select button.active{background:#fff}
#joystick{position:fixed;left:22px;bottom:22px;width:132px;height:132px;border-radius:50%;background:#10251d88;border:2px solid #ffffff55;z-index:9;touch-action:none}
#stick{position:absolute;left:43px;top:43px;width:46px;height:46px;border-radius:50%;background:#ffd34f;border:0;box-shadow:0 4px 0 #a56e15}
#actions{position:fixed;right:18px;bottom:22px;z-index:9;display:grid;grid-template-columns:repeat(2,58px);gap:8px}
#actions button{font-size:18px;padding:13px 8px}
#actions button{border:0;border-radius:14px;background:#ffd34f;color:#50360a;font-weight:1000;box-shadow:0 4px 0 #a56e15;touch-action:manipulation}
#actions #act{grid-column:1/3;width:124px;font-size:14px}
#actions #cameraMode{grid-column:1/3;width:124px}
#cameraMode{position:fixed;right:12px;bottom:18px;z-index:9;border:0;border-radius:14px;padding:11px 14px;background:#fff;color:#18351b;font-weight:1000;box-shadow:0 4px 0 #7b9d72;touch-action:manipulation}
#cameraMode small{display:block;opacity:.65;font-size:10px}
#inventoryBtn{position:fixed;top:18px;right:18px;z-index:10;border:0;border-radius:14px;padding:11px 14px;background:#fff;color:#18351b;font-weight:1000;box-shadow:0 4px 0 #7b9d72}
#inventory{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:#0008}
#inventory.open{display:grid}
#inventoryPanel{width:min(92vw,560px);max-height:82vh;overflow:auto;background:#17331f;color:#fff;border:2px solid #ffffff35;border-radius:20px;padding:18px;box-shadow:0 12px 40px #0008}
#inventoryPanel h2{margin:0 0 14px}
.invGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.invItem{background:#ffffff12;border:1px solid #ffffff20;border-radius:14px;padding:12px;text-align:center;font-weight:900}
.invItem span{display:block;font-size:28px;margin-bottom:5px}
#closeInventory{margin-top:14px;width:100%;border:0;border-radius:12px;padding:12px;background:#ffd34f;color:#50360a;font-weight:1000}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#78c95a;z-index:20;color:#fff;font-size:20px;font-weight:900}
.small{opacity:.75;font-size:12px}
@media(min-width:800px){#actions{display:none}}
</style>
</head>
<body>
<div id="game"></div>
<button id="inventoryBtn">🎒 INVENTARIO</button>
<div id="inventory"><div id="inventoryPanel">
<h2>🎒 Inventario</h2>
<div class="invGrid" id="inventoryGrid"></div>
<button id="closeInventory">CERRAR</button>
</div></div>
<div id="loading">🌱 Preparando prueba 3D…</div>
<div id="hud">
  <div class="panel" id="status">🌳 Árbol de prueba · 100 resistencia</div>
  <div class="panel" id="character">🐔 Selección: —</div>
</div>
<div id="select">
  <button id="mike">Mike</button>
  <button id="micaela">Micaela</button>
</div>
<div id="farmHud" class="panel" style="position:fixed;left:12px;bottom:18px;z-index:8;display:none">🌱 Parcela: libre</div>
<div id="joystick"><button id="stick"></button></div>
<div id="actions">
  <button id="act">🤲 INTERACTUAR</button>
  <button id="cameraMode">👤 TERCERA</button>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';

const root=document.getElementById('game');
const loading=document.getElementById('loading');
const status=document.getElementById('status');
const characterLabel=document.getElementById('character');
const inventory=document.getElementById('inventory');
const inventoryGrid=document.getElementById('inventoryGrid');
const inventoryItems=[
 {id:'pasto',icon:'🌿',name:'Pasto',qty:1},
 {id:'madera',icon:'🪵',name:'Madera',qty:1},
 {id:'huevo',icon:'🥚',name:'Huevo',qty:1},
 {id:'semillas',icon:'🌱',name:'Semillas',qty:1},
 {id:'trigo',icon:'🌾',name:'Trigo',qty:1},
 {id:'manzana',icon:'🍎',name:'Manzana',qty:1},
 {id:'piedra',icon:'🪨',name:'Piedra',qty:1},
 {id:'tierra',icon:'🟫',name:'Tierra',qty:1}
];
const mochila={slots:8,capacity:10};
function renderInventory(){
 inventoryGrid.innerHTML=inventoryItems.map(i=>'<div class="invItem"><span>'+i.icon+'</span>'+i.name+'<br>x'+i.qty+'</div>').join('');
}
document.getElementById('inventoryBtn').onclick=()=>{renderInventory();inventory.classList.add('open')};
document.getElementById('closeInventory').onclick=()=>inventory.classList.remove('open');
inventory.addEventListener('pointerdown',e=>{if(e.target===inventory)inventory.classList.remove('open')});
renderInventory();inventory.classList.add('open')};
document.getElementById('closeInventory').onclick=()=>inventory.classList.remove('open');
inventory.addEventListener('pointerdown',e=>{if(e.target===inventory)inventory.classList.remove('open')});
renderInventory();

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x86cf63);
scene.fog=new THREE.Fog(0x86cf63,35,110);

const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,300);
camera.position.set(0,3.5,7);
let cameraMode='third';
const cameraTarget=new THREE.Vector3();
const cameraDesired=new THREE.Vector3();
const cameraOffset=new THREE.Vector3();
const cameraModeButton=document.getElementById('cameraMode');
cameraModeButton.onclick=()=>{
 cameraMode=cameraMode==='third'?'first':'third';
 cameraModeButton.textContent=cameraMode==='third'?'👤 TERCERA':'👁️ PRIMERA';
};

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x557744,2.1));
const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(12,20,8);sun.castShadow=true;scene.add(sun);

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(180,180),
 new THREE.MeshStandardMaterial({color:0x67ad4d,roughness:1})
);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

const path=new THREE.Mesh(
 new THREE.PlaneGeometry(9,180),
 new THREE.MeshStandardMaterial({color:0xb88954,roughness:1})
);
path.rotation.x=-Math.PI/2;path.position.y=.01;scene.add(path);

const loader=new GLTFLoader();
const draco=new DRACOLoader();
draco.setDecoderPath('https://unpkg.com/three@0.180.0/examples/jsm/libs/draco/');
loader.setDRACOLoader(draco);
const MODELS={
 treeA:'./assets/trees/eggaro-tree-a.glb',
 treeB:'./assets/trees/eggaro-tree-b.glb',
 Mike:'./assets/characters/mike-optimized.glb',
 Micaela:'./assets/characters/micaela-optimized.glb'
};

let player,tree,playerMixer,playerAnimations=[];
let farmPlot,cropVisual,highGrassGroup;
let selected=localStorage.getItem('gamerpro_personaje')||new URLSearchParams(location.search).get('personaje')||'Micaela';
if(!['Mike','Micaela'].includes(selected))selected='Micaela';

const playerState={x:0,z:8,speed:4};
const treeState={resistance:100,maxResistance:100,alive:true};
let nearbyObject='';
const farmHud=document.getElementById('farmHud');
const crop={stage:0,planted:false,ready:false,water:0};
function makeHighGrass(){
 const g=new THREE.Group();
 // Hierba alta 3D optimizada: instancias reales para evitar cientos de objetos individuales.
 const geo=new THREE.ConeGeometry(.11,1.25,5);
 geo.translate(0,.625,0);
 const mat=new THREE.MeshStandardMaterial({color:0x4f9b32,roughness:1});
 const count=950;
 const grass=new THREE.InstancedMesh(geo,mat,count);
 grass.instanceMatrix.setUsage(THREE.StaticDrawUsage);
 const dummy=new THREE.Object3D();
 let seed=918273;
 const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
 let i=0;
 while(i<count){
  const x=-28+rand()*56;
  const z=-30+rand()*60;
  // Dejar libre el camino y la parcela inicial.
  if(Math.abs(x)<5.2) continue;
  if(Math.abs(x)<5.2 && Math.abs(z-8)<5.2) continue;
  dummy.position.set(x,.02,z);
  dummy.scale.set(.7+rand()*.8,.75+rand()*1.25,.7+rand()*.8);
  dummy.rotation.y=rand()*Math.PI;
  dummy.updateMatrix();
  grass.setMatrixAt(i++,dummy.matrix);
 }
 grass.instanceMatrix.needsUpdate=true;
 grass.castShadow=false;
 grass.receiveShadow=true;
 g.add(grass);
 scene.add(g);
 return g;
}

function makeFarm(){
 const g=new THREE.Group();
 const soil=new THREE.Mesh(new THREE.BoxGeometry(8,.18,7),new THREE.MeshStandardMaterial({color:0x6b472d,roughness:1}));
 soil.position.set(0,.09,8);soil.receiveShadow=true;g.add(soil);
 for(let i=-2.5;i<=2.5;i+=1.25){
  const row=new THREE.Mesh(new THREE.BoxGeometry(.18,.04,6.2),new THREE.MeshStandardMaterial({color:0x4a301f}));
  row.position.set(i,.2,8);g.add(row);
 }
 g.visible=true;scene.add(g);return g;
}
function updateCropVisual(){
 if(!farmPlot)return;
 if(cropVisual)farmPlot.remove(cropVisual);
 if(!crop.planted)return;
 const g=new THREE.Group();
 const count=5;
 for(let i=0;i<count;i++){
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(.035,.05,.55+crop.stage*.25,6),new THREE.MeshStandardMaterial({color:0x3c8f35}));
  stem.position.set(-2.5+i*1.25,.5,8);g.add(stem);
  if(crop.ready){
   const fruit=new THREE.Mesh(new THREE.SphereGeometry(.18,10,8),new THREE.MeshStandardMaterial({color:0xffc928}));
   fruit.position.set(-2.5+i*1.25,.85,8);g.add(fruit);
  }
 }
 cropVisual=g;farmPlot.add(g);
}
const keys={};
let joyPointer=null;
const joy=document.getElementById('joystick'),stick=document.getElementById('stick');
function updateJoystick(e){
 const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy,max=43,d=Math.hypot(dx,dy);
 if(d>max){dx=dx/d*max;dy=dy/d*max}
 stick.style.transform=`translate(${dx}px,${dy}px)`;
 keys.a=dx<-12;keys.d=dx>12;keys.w=dy<-12;keys.s=dy>12;
}
joy.addEventListener('pointerdown',e=>{joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);updateJoystick(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)updateJoystick(e)});
function resetJoystick(){joyPointer=null;stick.style.transform='translate(0,0)';keys.a=keys.d=keys.w=keys.s=false}
joy.addEventListener('pointerup',resetJoystick);joy.addEventListener('pointercancel',resetJoystick);

function setStatus(t){status.textContent=t}
function setSelection(name){selected=name;localStorage.setItem('gamerpro_personaje',name);characterLabel.textContent='🐔 Selección: '+name;document.getElementById(name.toLowerCase()).classList.add('active');for(const n of ['mike','micaela'])if(n!==name.toLowerCase())document.getElementById(n).classList.remove('active');loadCharacter()}
document.getElementById('mike').onclick=()=>setSelection('Mike');
document.getElementById('micaela').onclick=()=>setSelection('Micaela');
characterLabel.textContent='🐔 Selección: '+selected;
document.getElementById(selected.toLowerCase()).classList.add('active');

async function loadModel(path){
 console.log('[EGGARO] Cargando GLB:',path);
 const gltf=await loader.loadAsync(path, progress=>{
  if(progress.total) console.log('[EGGARO]',Math.round(progress.loaded/progress.total*100)+'%',path);
 });
 const obj=gltf.scene;
 obj.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
 return obj;
}

async function loadCharacter(){
 if(player){scene.remove(player);player=null;playerMixer=null;}
 try{
  const gltf=await loader.loadAsync(MODELS[selected]);
  player=gltf.scene;
  playerAnimations=gltf.animations||[];
  player.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=true;}});
  const box=new THREE.Box3().setFromObject(player);
  const size=box.getSize(new THREE.Vector3());
  const center=box.getCenter(new THREE.Vector3());
  const height=Math.max(size.y,0.001);
  const targetHeight=2.6;
  const s=targetHeight/height;
  player.scale.setScalar(s);
  player.position.set(playerState.x,-box.min.y*s,playerState.z);
  player.position.x-=center.x*s;
  player.position.z-=center.z*s;
  scene.add(player);
  if(playerAnimations.length){
    playerMixer=new THREE.AnimationMixer(player);
    const idle=playerAnimations.find(a=>/idle|reposo|stand/i.test(a.name))||playerAnimations[0];
    if(idle)playerMixer.clipAction(idle).reset().play();
  }
  characterLabel.textContent='🐔 Selección: '+selected;
 }catch(e){console.error('[EGGARO] Error personaje:',e);setStatus('⚠️ No se pudo cargar '+selected)}
}

farmPlot=makeFarm();
highGrassGroup=makeHighGrass();

async function loadTree(){
 tree=await loadModel(MODELS.treeA);
 tree.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=true;}});
 const box=new THREE.Box3().setFromObject(tree);
 const size=box.getSize(new THREE.Vector3());
 const center=box.getCenter(new THREE.Vector3());
 const height=Math.max(size.y,0.001);
 const s=6/height;
 tree.scale.setScalar(s);
 tree.position.set(-center.x*s,-box.min.y*s,-center.z*s);
 scene.add(tree);
}

function getNearbyObject(){
 if(treeState.alive && Math.hypot(playerState.x,playerState.z)<4.5)return 'tree';
 const farmX=Math.abs(playerState.x)<5 && Math.abs(playerState.z-8)<5;
 if(farmX)return 'farm';
 return '';
}
function updateActionButton(){
 const obj=getNearbyObject();
 nearbyObject=obj;
 const labels={tree:'🪓 CORTAR',farm:'🌱 CULTIVAR','':'🤲 INTERACTUAR'};
 document.getElementById('act').textContent=labels[obj];
}
function nearTree(){return treeState.alive && Math.hypot(playerState.x,playerState.z)<4.5}

function testTree(){
 if(!nearTree()){setStatus('🌳 Acércate al árbol de prueba');return}
 treeState.resistance=Math.max(0,treeState.resistance-10);
 if(treeState.resistance>0){
  setStatus('🌳 Árbol · resistencia '+treeState.resistance+'/100');
  tree.rotation.z=.045;
  setTimeout(()=>{if(tree)tree.rotation.z=0},100);
 }else{
  treeState.alive=false;
  tree.visible=false;
  setStatus('🪵 ¡Prueba completada! El árbol cayó');
 }
}

function farmAction(){
 if(!player)return;
 const x=Math.round(playerState.x),z=Math.round(playerState.z);
 const farmX=Math.abs(x)<5 && Math.abs(z-8)<5;
 if(!farmX){setStatus('🌱 Ve a la parcela para cultivar');return}
 if(!crop.planted){
  crop.planted=true;crop.stage=1;crop.water=0;
  updateCropVisual();
  farmHud.style.display='block';farmHud.textContent='🌱 Semilla plantada · riégala';
  setStatus('🌱 ¡Semilla plantada!');
 }else if(!crop.ready){
  crop.water++;
  if(crop.water>=1){crop.stage=2;crop.ready=true;updateCropVisual();farmHud.textContent='🌾 ¡Cultivo listo para cosechar!';setStatus('💧 Cultivo regado');}
 }else{
  crop.planted=false;crop.ready=false;crop.stage=0;crop.water=0;updateCropVisual();
  farmHud.textContent='🌱 Parcela libre';setStatus('🌾 ¡Cosecha recogida!');
 }
}
document.getElementById('act').onclick=()=>{
 const obj=getNearbyObject();
 if(obj==='tree')testTree();
 else if(obj==='farm')farmAction();
 else setStatus('🤲 Acércate a un objeto para interactuar');
};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')testTree()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
for(const b of document.querySelectorAll('[data-key]')){
 const k=b.dataset.key;
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false));
}

let stumbleCooldown=0;
function move(dt){
 if(!player)return;
 let x=0,z=0;
 if(keys.a||keys.arrowleft)x--;
 if(keys.d||keys.arrowright)x++;
 if(keys.w||keys.arrowup)z--;
 if(keys.s||keys.arrowdown)z++;
 if(!x&&!z)return;
 const l=Math.hypot(x,z);x/=l;z/=l;
 const inHighGrass=Math.abs(playerState.x)>5.2 && Math.abs(playerState.x)<28 && Math.abs(playerState.z)<30;
 const moveSpeed=inHighGrass?1.55:playerState.speed;
 playerState.x+=x*moveSpeed*dt;
 playerState.z+=z*moveSpeed*dt;
 if(inHighGrass && stumbleCooldown<=0 && Math.random()<0.035*dt){
  stumbleCooldown=1.1;
  playerState.x-=x*.65;
  playerState.z-=z*.65;
  setStatus('🪢 ¡Te enredaste en la hierba alta!');
 }
 stumbleCooldown=Math.max(0,stumbleCooldown-dt);
 player.position.x=playerState.x;player.position.z=playerState.z;
 if(Math.abs(x)+Math.abs(z)>0) player.rotation.y=Math.atan2(x,z);
 updateActionButton();
}

let last=performance.now();
function animate(now){
 const dt=Math.min((now-last)/1000,.05);last=now;
 move(dt);
 updateActionButton();
 if(playerMixer)playerMixer.update(dt);
 if(player){
  if(cameraMode==='third'){
   // Tercera persona: cámara detrás y ligeramente elevada, siguiendo la orientación del personaje.
   cameraOffset.set(0,3.4,6.8).applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y);
   cameraDesired.copy(player.position).add(cameraOffset);
   cameraTarget.set(player.position.x,player.position.y+1.35,player.position.z);
  }else{
   // Primera persona: altura de ojos, sin mostrar el propio modelo desde dentro.
   cameraDesired.set(player.position.x,player.position.y+2.15,player.position.z);
   const forward=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y);
   cameraTarget.copy(cameraDesired).add(forward.multiplyScalar(8));
  }
  camera.position.lerp(cameraDesired,1-Math.pow(.00005,dt));
  camera.lookAt(cameraTarget);
 }
 renderer.render(scene,camera);
 requestAnimationFrame(animate);
}

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
(async()=>{
 try{
  await loadTree();
  await loadCharacter();
  farmHud.style.display='block';
  farmHud.textContent='🌱 Parcela lista · CULTIVAR';
  loading.style.display='none';
  setStatus('🌾 Granja inicial · hierba alta');
 }catch(e){
  loading.textContent='⚠️ Error cargando los modelos 3D';
  console.error(e);
 }
 requestAnimationFrame(animate);
})();
</script>
</body>
</html>
