 {id:'pasto',icon:'🌿',name:'Pasto',qty:1},

 inventoryGrid.innerHTML=inventoryItems.map(i=>'<div class="invItem"><span>'+i.icon+'</span>'+i.name+'<br>x'+i.qty+'</div>').join('');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x86cf63);
scene.fog=new THREE.Fog(0x86cf63,35,110);

const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,300);
camera.position.set(0,3.5,7);
const cameraTarget=new THREE.Vector3();
const cameraDesired=new THREE.Vector3();
const cameraOffset=new THREE.Vector3();
let cameraYaw=Math.PI;
let cameraPitch=0.72;
let cameraDistance=8.5;

const CAMERA_MIN_DISTANCE=4;
const CAMERA_MAX_DISTANCE=14;
const CAMERA_MIN_PITCH=0.12;
const CAMERA_MAX_PITCH=1.05;

const cameraPointers=new Map();
let mouseCameraActive=false;
let mouseLastX=0;
let mouseLastY=0;
let pinchStartDistance=0;
let pinchStartCameraDistance=8.5;

function cameraInputAllowed(target){
  return !!target && !target.closest('#joystick,#actions,#select,#inventory,#inventoryBtn,button');
}

function rotateCamera(dx,dy){
  cameraYaw+=dx*0.005;
  cameraPitch=THREE.MathUtils.clamp(
    cameraPitch+dy*0.003,
    CAMERA_MIN_PITCH,
    CAMERA_MAX_PITCH
  );
}

function zoomCamera(amount){
  cameraDistance=THREE.MathUtils.clamp(
    cameraDistance+amount,
    CAMERA_MIN_DISTANCE,
    CAMERA_MAX_DISTANCE
  );
}

function pointerDistance(){
  const p=[...cameraPointers.values()];
  if(p.length<2)return 0;
  return Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
}

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:'high-performance',
  depth:true,
  stencil:false,
  preserveDrawingBuffer:false
});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
root.appendChild(renderer.domElement);

// Cámara estilo Roblox:
// 1 dedo en el mundo = girar cámara.
// 2 dedos = zoom.
// PC = clic izquierdo + arrastre y rueda.
renderer.domElement.style.touchAction='none';
renderer.domElement.style.userSelect='none';

renderer.domElement.addEventListener('pointerdown',e=>{
  if(!cameraInputAllowed(e.target))return;

  if(e.pointerType==='mouse'){
    if(e.button!==0)return;
    mouseCameraActive=true;
    mouseLastX=e.clientX;
    mouseLastY=e.clientY;
    renderer.domElement.setPointerCapture?.(e.pointerId);
    e.preventDefault();
    return;
  }

  cameraPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  renderer.domElement.setPointerCapture?.(e.pointerId);
  e.preventDefault();

  if(cameraPointers.size===1){
    const p=cameraPointers.get(e.pointerId);
    p.lastX=p.x;
    p.lastY=p.y;
  }else if(cameraPointers.size===2){
    pinchStartDistance=pointerDistance();
    pinchStartCameraDistance=cameraDistance;
  }
},{passive:false});

renderer.domElement.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){
    if(!mouseCameraActive)return;
    rotateCamera(e.clientX-mouseLastX,e.clientY-mouseLastY);
    mouseLastX=e.clientX;
    mouseLastY=e.clientY;
    e.preventDefault();
    return;
  }

  const p=cameraPointers.get(e.pointerId);
  if(!p)return;

  if(cameraPointers.size===1){
    rotateCamera(e.clientX-p.x,e.clientY-p.y);
    p.x=e.clientX;
    p.y=e.clientY;
  }else if(cameraPointers.size===2 && pinchStartDistance>0){
    const d=pointerDistance();
    cameraDistance=THREE.MathUtils.clamp(
      pinchStartCameraDistance-(d-pinchStartDistance)*0.018,
      CAMERA_MIN_DISTANCE,
      CAMERA_MAX_DISTANCE
    );
  }
  e.preventDefault();
},{passive:false});

function endCameraPointer(e){
  if(e.pointerType==='mouse'){
    mouseCameraActive=false;
    return;
  }
  cameraPointers.delete(e.pointerId);
  if(cameraPointers.size<2)pinchStartDistance=0;
}

renderer.domElement.addEventListener('pointerup',endCameraPointer);
renderer.domElement.addEventListener('pointercancel',endCameraPointer);
renderer.domElement.addEventListener('pointerleave',e=>{
  if(e.pointerType==='mouse')mouseCameraActive=false;
});

renderer.domElement.addEventListener('wheel',e=>{
  if(!cameraInputAllowed(e.target))return;
  e.preventDefault();
  zoomCamera(e.deltaY*0.012);
},{passive:false});

scene.add(new THREE.HemisphereLight(0xffffff,0x557744,2.1));
const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(12,20,8);sun.castShadow=true;scene.add(sun);

const mapTextureLoader=new THREE.TextureLoader();
const MAP_WIDTH=60;
const MAP_DEPTH=100;
const mapTexture=mapTextureLoader.load('./IMG-20260927-WA0019.jpg',()=>{
  mapTexture.colorSpace=THREE.SRGBColorSpace;

});
mapTexture.colorSpace=THREE.SRGBColorSpace;

mapPlane.rotation.x=-Math.PI/2;

// El GLB es ahora el escenario principal.

const mapShadow=new THREE.Mesh(
  new THREE.CircleGeometry(.9,24),
  new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.18,depthWrite:false})
);
mapShadow.rotation.x=-Math.PI/2;
mapShadow.position.y=.01;
scene.add(mapShadow);

const loader=new GLTFLoader();
const draco=new DRACOLoader();
draco.setDecoderPath('https://unpkg.com/three@0.180.0/examples/jsm/libs/draco/');
loader.setDRACOLoader(draco);
const MODELS={
 treeA:'./assets/trees/eggaro-tree-a.glb',
 treeB:'./assets/trees/eggaro-tree-b.glb',
 Mike:'./assets/characters/mike-optimized.glb',
 Micaela:'./assets/characters/micaela-optimized.glb'
};

let player,tree,farmModel,playerMixer,playerAnimations=[];
let farmPlot,cropVisual,highGrassGroup;
const selected='Micaela';

const playerState={x:0,z:0,speed:4};

// Colisiones invisibles alineadas con el mapa de IMG-20260927-WA0019.jpg.
// Coordenadas del plano: X izquierda/derecha, Z arriba/abajo.
const collisionBoxes=[];
let farmWorldBox=null;

function addCollision(x,z,w,d,pad=.28){
  if(w<.2 || d<.2)return;
  collisionBoxes.push({x,z,w:w+pad*2,d:d+pad*2});
}
function collidesAt(x,z){
  const radius=.48;
  for(const b of collisionBoxes){
    if(
      x+radius>b.x-b.w/2 && x-radius<b.x+b.w/2 &&
      z+radius>b.z-b.d/2 && z-radius<b.z+b.d/2
    ) return true;
  }
  return false;
}
function buildWorldCollisions(){
  collisionBoxes.length=0;
  if(!farmModel)return;

  farmWorldBox=new THREE.Box3().setFromObject(farmModel);
  const min=farmWorldBox.min,max=farmWorldBox.max;

  // Límites reales del GLB.
  addCollision((min.x+max.x)/2,min.z-1.2,max.x-min.x+2.4,1.5,.2);
  addCollision((min.x+max.x)/2,max.z+1.2,max.x-min.x+2.4,1.5,.2);
  addCollision(min.x-1.2,(min.z+max.z)/2,1.5,max.z-min.z+2.4,.2);
  addCollision(max.x+1.2,(min.z+max.z)/2,1.5,max.z-min.z+2.4,.2);

  // Obstáculos del GLB. Se ignoran pisos/terrenos muy planos o gigantes.
  farmModel.traverse(o=>{
    if(!o.isMesh)return;
    const b=new THREE.Box3().setFromObject(o);
    const size=b.getSize(new THREE.Vector3());
    const w=size.x,d=size.z,h=size.y;
    if(w<.7 || d<.7 || h<.55)return;
    if(w*d>180)return;
    if(h<Math.min(w,d)*.12 && h<1.4)return;
    addCollision((b.min.x+b.max.x)/2,(b.min.z+b.max.z)/2,w,d,.22);
  });
}

function findSafeSpawn(){
  if(!farmWorldBox){playerState.x=0;playerState.z=0;return;}
  const min=farmWorldBox.min,max=farmWorldBox.max;
  const candidates=[
    new THREE.Vector3(0,0,0),
    new THREE.Vector3(0,0,8),
    new THREE.Vector3(0,0,16),
    new THREE.Vector3(-8,0,8),
    new THREE.Vector3(8,0,8),
    new THREE.Vector3(0,0,-8)
  ];
  for(const p of candidates){
    if(p.x>min.x+2 && p.x<max.x-2 && p.z>min.z+2 && p.z<max.z-2 && !collidesAt(p.x,p.z)){
      playerState.x=p.x;playerState.z=p.z;return;
    }
  }
  playerState.x=0;playerState.z=0;
}

const treeState={resistance:100,maxResistance:100,alive:true};
let nearbyObject='';
const farmHud=document.getElementById('farmHud');
const crop={stage:0,planted:false,ready:false,water:0};
function makeHighGrass(){
 const g=new THREE.Group();
 // Hierba alta 3D optimizada: instancias reales para evitar cientos de objetos individuales.
 const geo=new THREE.ConeGeometry(.11,1.25,5);
 geo.translate(0,.625,0);
 const mat=new THREE.MeshStandardMaterial({color:0x4f9b32,roughness:1});
 const count=950;
 const grass=new THREE.InstancedMesh(geo,mat,count);
 grass.instanceMatrix.setUsage(THREE.StaticDrawUsage);
 const dummy=new THREE.Object3D();
 let seed=918273;
 const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
 let i=0;
 while(i<count){
  const x=-28+rand()*56;
  const z=-30+rand()*60;
  // Dejar libre el camino y la parcela inicial.
  if(Math.abs(x)<5.2) continue;
  if(Math.abs(x)<5.2 && Math.abs(z-8)<5.2) continue;
  dummy.position.set(x,.02,z);
  dummy.scale.set(.7+rand()*.8,.75+rand()*1.25,.7+rand()*.8);
  dummy.rotation.y=rand()*Math.PI;
  dummy.updateMatrix();
  grass.setMatrixAt(i++,dummy.matrix);
 }
 grass.instanceMatrix.needsUpdate=true;
 grass.castShadow=false;
 grass.receiveShadow=true;
 g.add(grass);
 scene.add(g);
 return g;
}

function makeFarm(){
 const g=new THREE.Group();
 const soil=new THREE.Mesh(new THREE.BoxGeometry(8,.18,7),new THREE.MeshStandardMaterial({color:0x6b472d,roughness:1}));
 soil.position.set(0,.09,8);soil.receiveShadow=true;g.add(soil);
 for(let i=-2.5;i<=2.5;i+=1.25){
  const row=new THREE.Mesh(new THREE.BoxGeometry(.18,.04,6.2),new THREE.MeshStandardMaterial({color:0x4a301f}));
  row.position.set(i,.2,8);g.add(row);
 }
 g.visible=true;scene.add(g);return g;
}
function updateCropVisual(){
 if(!farmPlot)return;
 if(cropVisual)farmPlot.remove(cropVisual);
 if(!crop.planted)return;
 const g=new THREE.Group();
 const count=5;
 for(let i=0;i<count;i++){
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(.035,.05,.55+crop.stage*.25,6),new THREE.MeshStandardMaterial({color:0x3c8f35}));
  stem.position.set(-2.5+i*1.25,.5,8);g.add(stem);
  if(crop.ready){
   const fruit=new THREE.Mesh(new THREE.SphereGeometry(.18,10,8),new THREE.MeshStandardMaterial({color:0xffc928}));
   fruit.position.set(-2.5+i*1.25,.85,8);g.add(fruit);
  }
 }
 cropVisual=g;farmPlot.add(g);
}
const keys={};
let joyPointer=null;
const joy=document.getElementById('joystick'),stick=document.getElementById('stick');
function updateJoystick(e){
 const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy,max=43,d=Math.hypot(dx,dy);
 if(d>max){dx=dx/d*max;dy=dy/d*max}
 stick.style.transform=`translate(${dx}px,${dy}px)`;
 keys.a=dx<-12;keys.d=dx>12;keys.w=dy<-12;keys.s=dy>12;
}
joy.addEventListener('pointerdown',e=>{joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);updateJoystick(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)updateJoystick(e)});
function resetJoystick(){joyPointer=null;stick.style.transform='translate(0,0)';keys.a=keys.d=keys.w=keys.s=false}
joy.addEventListener('pointerup',resetJoystick);joy.addEventListener('pointercancel',resetJoystick);

function setStatus(t){status.textContent=t}
characterLabel.textContent='🐔 Micaela';

const loadingText=document.getElementById('loadingText');
const loadingFill=document.getElementById('loadingFill');
const loadingPercent=document.getElementById('loadingPercent');
const selectStatus=document.getElementById('selectStatus');
const startGame=document.getElementById('startGame');
function setLoadProgress(percent,text){
  const p=Math.max(0,Math.min(100,Math.round(percent)));
  loadingFill.style.width=p+'%';
  loadingPercent.textContent=p+'%';
  loadingText.textContent=text;
  selectStatus.textContent=text;
}
async function loadModel(path){
 console.log('[EGGARO] Cargando GLB:',path);
 const gltf=await loader.loadAsync(path, progress=>{
  if(progress.total) console.log('[EGGARO]',Math.round(progress.loaded/progress.total*100)+'%',path);
 });
 const obj=gltf.scene;
 obj.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
 return obj;
}

async function loadCharacter(){
 if(player){scene.remove(player);player=null;playerMixer=null;}
 const gltf=await loader.loadAsync(MODELS.Micaela);
 player=gltf.scene;
 playerAnimations=gltf.animations||[];
 player.traverse(o=>{
   if(o.isMesh){
     o.castShadow=false;
     o.receiveShadow=true;
     o.frustumCulled=true;
     if(o.material){
       const materials=Array.isArray(o.material)?o.material:[o.material];
       for(const m of materials){
         if(m.map)m.map.colorSpace=THREE.SRGBColorSpace;
         m.needsUpdate=true;
       }
     }
   }
 });
 const box=new THREE.Box3().setFromObject(player);
 const size=box.getSize(new THREE.Vector3());
 const center=box.getCenter(new THREE.Vector3());
 const height=Math.max(size.y,0.001);
 const s=2.6/height;
 player.scale.setScalar(s);
 player.position.set(playerState.x-center.x*s,0,playerState.z-center.z*s);
 scene.add(player);
 const scaledBox=new THREE.Box3().setFromObject(player);
 player.position.y-=scaledBox.min.y;
 if(playerAnimations.length){
   playerMixer=new THREE.AnimationMixer(player);
   const idle=playerAnimations.find(a=>/idle|reposo|stand/i.test(a.name))||playerAnimations[0];
   if(idle)playerMixer.clipAction(idle).reset().play();
 }
 characterLabel.textContent='🐔 Micaela';
}

highGrassGroup=makeHighGrass();

async function loadFarmModel(){
  const gltf=await loader.loadAsync('./granja.glb');
  farmModel=gltf.scene;
  farmModel.traverse(o=>{
    if(o.isMesh){
      o.frustumCulled=true;
      o.castShadow=false;
      o.receiveShadow=true;
      if(o.material){
        const materials=Array.isArray(o.material)?o.material:[o.material];
        for(const m of materials){
          if(m.map)m.map.colorSpace=THREE.SRGBColorSpace;
          m.needsUpdate=true;
        }
      }
    }
  });

  const box=new THREE.Box3().setFromObject(farmModel);
  const size=box.getSize(new THREE.Vector3());
  const center=box.getCenter(new THREE.Vector3());
  const maxSize=Math.max(size.x,size.z,0.001);

  // Escala estable: el escenario cabe en el área jugable sin deformarse.
  const scale=82/maxSize;
  farmModel.scale.setScalar(scale);
  farmModel.position.set(
    -center.x*scale,
    -box.min.y*scale,
    -center.z*scale
  );

  scene.add(farmModel);
  buildWorldCollisions();
  findSafeSpawn();

  // Evita que el mapa quede enterrado o flotando por pequeñas diferencias.
  const worldBox=new THREE.Box3().setFromObject(farmModel);
  if(Math.abs(worldBox.min.y)>0.05)farmModel.position.y-=worldBox.min.y;

  console.log('[EGGARO] Granja GLB cargada:',size.x,size.y,size.z,'escala',scale);
}

async function loadTree(){
  // Los árboles y construcciones ya forman parte del GLB de la granja.
  tree=null;
}
function getNearbyObject(){
 if(treeState.alive && tree && Math.hypot(playerState.x-tree.position.x,playerState.z-tree.position.z)<4.5)return 'tree';
 const farmX=Math.abs(playerState.x)<5 && Math.abs(playerState.z-8)<5;
 if(farmX)return 'farm';
 return '';
}
function updateActionButton(){
 const obj=getNearbyObject();
 nearbyObject=obj;
 const labels={tree:'🪓 CORTAR',farm:'🌱 CULTIVAR','':'🤲 INTERACTUAR'};
 document.getElementById('act').textContent=labels[obj];
}
function nearTree(){return treeState.alive && tree && Math.hypot(playerState.x-tree.position.x,playerState.z-tree.position.z)<4.5}

function testTree(){
 if(!nearTree()){setStatus('🌳 Acércate al árbol de prueba');return}
 treeState.resistance=Math.max(0,treeState.resistance-10);
 if(treeState.resistance>0){
  setStatus('🌳 Árbol · resistencia '+treeState.resistance+'/100');
  tree.rotation.z=.045;
  setTimeout(()=>{if(tree)tree.rotation.z=0},100);
 }else{
  treeState.alive=false;
  tree.visible=false;
  setStatus('🪵 ¡Prueba completada! El árbol cayó');
 }
}

function farmAction(){
 if(!player)return;
 const x=Math.round(playerState.x),z=Math.round(playerState.z);
 const farmX=Math.abs(x)<5 && Math.abs(z-8)<5;
 if(!farmX){setStatus('🌱 Ve a la parcela para cultivar');return}
 if(!crop.planted){
  crop.planted=true;crop.stage=1;crop.water=0;
  updateCropVisual();
  farmHud.style.display='block';farmHud.textContent='🌱 Semilla plantada · riégala';
  setStatus('🌱 ¡Semilla plantada!');
 }else if(!crop.ready){
  crop.water++;
  if(crop.water>=1){crop.stage=2;crop.ready=true;updateCropVisual();farmHud.textContent='🌾 ¡Cultivo listo para cosechar!';setStatus('💧 Cultivo regado');}
 }else{
  crop.planted=false;crop.ready=false;crop.stage=0;crop.water=0;updateCropVisual();
  farmHud.textContent='🌱 Parcela libre';setStatus('🌾 ¡Cosecha recogida!');
 }
}
document.getElementById('act').onclick=()=>{
 const obj=getNearbyObject();
 if(obj==='tree')testTree();
 else if(obj==='farm')farmAction();
 else setStatus('🤲 Acércate a un objeto para interactuar');
};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')testTree()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
for(const b of document.querySelectorAll('[data-key]')){
 const k=b.dataset.key;
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false));
}

let stumbleCooldown=0;
function move(dt){
 if(!player)return;
 let inputX=0,inputZ=0;
 if(keys.a||keys.arrowleft)inputX--;
 if(keys.d||keys.arrowright)inputX++;
 if(keys.w||keys.arrowup)inputZ--;
 if(keys.s||keys.arrowdown)inputZ++;
 if(!inputX&&!inputZ)return;

 const len=Math.hypot(inputX,inputZ);
 inputX/=len;inputZ/=len;

 // Movimiento relativo a la cámara, estilo tercera persona.
 // Usamos la dirección REAL hacia donde mira la cámara.
 const forward=new THREE.Vector3();
 camera.getWorldDirection(forward);
 forward.y=0;
 if(forward.lengthSq()<0.0001)return;
 forward.normalize();

 // Derecha de la cámara.
 const rightX=forward.z;
 const rightZ=-forward.x;
 const x=rightX*inputX+forward.x*inputZ;
 const z=rightZ*inputX+forward.z*inputZ;

 const moveSpeed=playerState.speed;
 const nextX=playerState.x+x*moveSpeed*dt;
 const nextZ=playerState.z+z*moveSpeed*dt;

 if(!collidesAt(nextX,playerState.z))playerState.x=nextX;
 if(!collidesAt(playerState.x,nextZ))playerState.z=nextZ;

 player.position.x=playerState.x;
 player.position.z=playerState.z;
 player.rotation.y=Math.atan2(x,z);

 mapShadow.position.x=playerState.x;
 mapShadow.position.z=playerState.z;
 updateActionButton();
}

let last=performance.now();
function animate(now){
 const dt=Math.min((now-last)/1000,.05);last=now;
 move(dt);
 updateActionButton();
 if(playerMixer)playerMixer.update(dt);
 if(player){
  // Cámara libre estilo Roblox: gira independientemente del personaje
  // y sigue suavemente su posición.
  const distance=cameraDistance;
  cameraOffset.set(
   Math.sin(cameraYaw)*Math.cos(cameraPitch)*distance,
   Math.sin(cameraPitch)*distance,
   Math.cos(cameraYaw)*Math.cos(cameraPitch)*distance
  );
  cameraDesired.copy(player.position).add(cameraOffset);
  cameraTarget.set(player.position.x,player.position.y+1.35,player.position.z);
  camera.position.lerp(cameraDesired,1-Math.pow(.000001,dt));
  camera.lookAt(cameraTarget);
 }
 renderer.render(scene,camera);
 requestAnimationFrame(animate);
}
