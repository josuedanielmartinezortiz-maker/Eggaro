<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EGGARO · Juego</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#78c95a}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;justify-content:space-between;pointer-events:none}
.panel{background:#10251ddd;color:#fff;border:1px solid #ffffff35;border-radius:14px;padding:9px 12px;font-weight:800;box-shadow:0 5px 18px #0003}
#resources{display:flex;gap:7px;flex-wrap:wrap}#hint{max-width:360px;text-align:center}
#actions{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:9px;flex-wrap:wrap;justify-content:center;width:min(96vw,700px)}
button{border:0;border-radius:15px;padding:13px 17px;background:#ffd34f;color:#50360a;font-weight:1000;font-size:16px;box-shadow:0 5px 0 #a56e15;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #a56e15}
#eggPanel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,90vw);background:#10251df5;color:#fff;border:1px solid #ffffff40;border-radius:22px;padding:22px;text-align:center;display:none;box-shadow:0 20px 60px #0008}
#egg{font-size:86px;display:block;animation:bob 1.2s ease-in-out infinite}#result{min-height:50px;font-size:22px;font-weight:900;margin:12px}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}.small{opacity:.75;font-size:13px;font-weight:700}
@media(max-width:600px){#hint{display:none}button{font-size:14px;padding:12px 13px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="panel" id="resources">🪵 0 · 🌾 0 · 🌱 0</div><div class="panel" id="hint">Acércate a un árbol y pulsa ✨ ACCIÓN</div></div>
<div id="actions"><button id="left">◀</button><button id="up">▲</button><button id="down">▼</button><button id="right">▶</button><button id="act">✨ ACCIÓN</button><button id="openEgg">🥚 HUEVO</button></div>
<div id="eggPanel"><div id="egg">🥚</div><h2>Huevo Noob</h2><div class="small">Noob 98% · Zombie 1% · Pollito Noob 1%</div><div id="result">Pulsa ABRIR</div><button id="hatch">🥚 ABRIR HUEVO</button><button id="closeEgg">Cerrar</button></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');

/* EGGARO TREE MODEL SYSTEM */
const EGGARO_TREE_MODELS={variantA:'./assets/trees/eggaro-tree-a.glb',variantB:'./assets/trees/eggaro-tree-b.glb'};
const EGGARO_TREE_CONFIG={hitDistance:105,hitsToCut:3,woodPerTree:3,respawnMs:30000};
window.EGGARO_TREE_MODELS=EGGARO_TREE_MODELS;
window.EGGARO_TREE_CONFIG=EGGARO_TREE_CONFIG;
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();

const player={x:0,y:0,speed:3.2,radius:17};
const resources=[
 {type:'tree',x:-250,y:-120,hp:3,maxHp:3,alive:true,respawn:0,shake:0},
 {type:'tree',x:280,y:-180,hp:3,maxHp:3,alive:true,respawn:0,shake:0},
 {type:'tree',x:-330,y:210,hp:3,maxHp:3,alive:true,respawn:0,shake:0},
 {type:'crop',x:180,y:230,hp:2,alive:true},{type:'crop',x:320,y:100,hp:2,alive:true},
 {type:'pickup',x:-80,y:-260,hp:1,alive:true}
];
const state={wood:0,wheat:0,seeds:0};
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
function bind(id,k){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))}
bind('left','a');bind('right','d');bind('up','w');bind('down','s');

function setHint(t){document.getElementById('hint').textContent=t}
function nearest(){
 let best=null,dist=Infinity;
 for(const r of resources)if(r.alive){const d=Math.hypot(r.x-player.x,r.y-player.y);if(d<dist){dist=d;best=r}}
 return {r:best,d:dist};
}
function treeCollision(nx,ny){
 for(const r of resources)if(r.alive&&r.type==='tree'){
   const d=Math.hypot(r.x-nx,r.y-ny);
   if(d<54+player.radius)return true;
 }
 return false;
}
function move(){
 let dx=0,dy=0;
 if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;
 if(keys.w||keys.arrowup)dy--;if(keys.s||keys.arrowdown)dy++;
 if(!dx&&!dy)return;
 const l=Math.hypot(dx,dy);dx=dx/l*player.speed;dy=dy/l*player.speed;
 const nx=player.x+dx,ny=player.y+dy;
 if(!treeCollision(nx,player.y))player.x=nx;
 if(!treeCollision(player.x,ny))player.y=ny;
}
function act(){
 const n=nearest();
 if(!n.r||n.d>105){setHint('🌳 Acércate a un árbol para talarlo');return}
 const r=n.r;
 if(r.type==='tree'){
   r.hp--;r.shake=10;
   if(r.hp>0)setHint('🪓 ¡Golpe! Árbol: '+r.hp+'/'+r.maxHp+' de vida');
   else{
     r.alive=false;r.respawn=30000;state.wood+=3;
     setHint('🪵 ¡Árbol talado! +3 madera · reaparece en 30 s');
   }
 }else if(r.type==='crop'){
   r.hp--;setHint(r.hp>0?'🌾 Cosechando…':'🌾 ¡Cosecha lista!');
   if(r.hp<=0){r.alive=false;state.wheat+=4;state.seeds+=1}
 }else{
   r.alive=false;state.seeds+=2;setHint('🌱 Recogiste 2 semillas');
 }
 updateHUD();
}
document.getElementById('act').onclick=act;
function updateHUD(){document.getElementById('resources').textContent='🪵 '+state.wood+' · 🌾 '+state.wheat+' · 🌱 '+state.seeds}

function draw(){
 ctx.clearRect(0,0,W,H);
 const ox=W/2-player.x,oy=H/2-player.y;
 ctx.fillStyle='#72b84c';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#b9894e';ctx.beginPath();ctx.moveTo(W*.42,0);ctx.lineTo(W*.58,0);ctx.lineTo(W*.75,H);ctx.lineTo(W*.25,H);ctx.closePath();ctx.fill();
 for(let i=0;i<34;i++){const x=(i%2?1:-1)*(330+(i*71)%240)+ox,y=((i*113)%900)-450+oy;drawTree(x,y,.8+(i%3)*.12)}
 for(const r of resources)if(r.alive){
   const x=r.x+ox,y=r.y+oy;
   if(r.type==='tree')drawTree(x,y,1.05,r.shake);
   else if(r.type==='crop')drawCrop(x,y);else drawPickup(x,y)
 }
 const px=W/2,py=H/2;
 ctx.fillStyle='#e8b37b';ctx.beginPath();ctx.arc(px,py-28,18,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#355e9b';ctx.fillRect(px-19,py-10,38,45);ctx.fillStyle='#333';ctx.fillRect(px-14,py+35,9,18);ctx.fillRect(px+5,py+35,9,18);
}
function drawTree(x,y,s,shake=0){
 ctx.save();ctx.translate(x+(shake?Math.sin(shake*2)*3:0),y);ctx.rotate(shake?Math.sin(shake)*.035:0);ctx.scale(s,s);
 ctx.fillStyle='#70472c';ctx.fillRect(-9,5,18,48);ctx.fillStyle='#2f7d3d';
 for(const p of [[0,-18],[-28,2],[27,2],[0,18]]){ctx.beginPath();ctx.arc(p[0],p[1],31,0,Math.PI*2);ctx.fill()}
 ctx.restore();
}
function drawCrop(x,y){ctx.strokeStyle='#e5c15b';ctx.lineWidth=6;for(let i=-18;i<=18;i+=9){ctx.beginPath();ctx.moveTo(x+i,y+20);ctx.lineTo(x+i-3,y-20);ctx.stroke()}}
function drawPickup(x,y){ctx.font='34px sans-serif';ctx.fillText('🌱',x-17,y+12)}

let last=performance.now();
function loop(now){
 const dt=now-last;last=now;move();
 for(const r of resources)if(r.type==='tree'){
   if(r.shake>0)r.shake=Math.max(0,r.shake-dt/16);
   if(!r.alive&&r.respawn>0){r.respawn-=dt;if(r.respawn<=0){r.alive=true;r.hp=r.maxHp;r.shake=0;setHint('🌱 ¡Un árbol volvió a crecer!')}}
 }
 draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

const panel=document.getElementById('eggPanel');
document.getElementById('openEgg').onclick=()=>{panel.style.display='block';document.getElementById('result').textContent='Pulsa ABRIR'};
document.getElementById('closeEgg').onclick=()=>panel.style.display='none';
document.getElementById('hatch').onclick=()=>{const n=Math.random()*100;let result=n<98?'🐔 Noob — 98%':n<99?'🧟 Zombie — 1%':'🐤 Pollito Noob — 1%';document.getElementById('result').textContent='Resultado: '+result};
</script>
</body>
</html>
