<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EGGARO · Cinemática inicial</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07131b;font-family:Arial,sans-serif}
#scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 48%,rgba(0,0,0,.28) 100%);opacity:.55}
#dialogue{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);width:min(820px,90vw);padding:18px 24px;border-radius:18px;background:rgba(10,18,24,.78);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(7px);color:#fff;text-align:center;opacity:0;transition:opacity .7s;pointer-events:none}
#speaker{font-size:14px;font-weight:900;letter-spacing:2px;color:#ffd95a;margin-bottom:7px}
#text{font-size:clamp(18px,3vw,28px);line-height:1.25}
#skip{position:fixed;right:18px;top:18px;padding:9px 14px;border:1px solid #ffffff55;border-radius:12px;background:#07131b99;color:#fff;font-weight:700;cursor:pointer}
#end{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,10,14,.15);opacity:0;pointer-events:none;transition:opacity 1.2s}
#end h1{margin:0;color:#ffd84d;font-size:clamp(54px,13vw,130px);letter-spacing:8px;text-shadow:0 5px 0 #8e5b0b,0 0 30px #ffe9a0}
#end p{color:#fff;font-size:clamp(20px,4vw,34px);letter-spacing:5px}
#continue{margin-top:22px;padding:14px 28px;border:2px solid #fff;border-radius:14px;background:#e9a51d;color:#5d3b08;font-weight:900;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div id="scene"></div><div id="vignette"></div>
<button id="skip">Saltar cinemática</button>
<div id="dialogue"><div id="speaker"></div><div id="text"></div></div>
<div id="end"><h1>EGGARO</h1><p>CONTINUARÁ…</p><button id="continue">CONTINUAR</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x83cdf4);
scene.fog=new THREE.Fog(0x83cdf4,28,85);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,140);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7)); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('scene').appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xfff5d5,0x416b35,2.4); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe0a0,3.2); sun.position.set(-15,25,12); sun.castShadow=true; scene.add(sun);

const world=new THREE.Group(); scene.add(world);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x5fa646,roughness:1}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; world.add(ground);

const path=new THREE.Mesh(new THREE.PlaneGeometry(7,70),new THREE.MeshStandardMaterial({color:0xb9894e,roughness:1}));
path.rotation.x=-Math.PI/2; path.position.set(0,.012,-18); world.add(path);

function box(w,h,d,c,x,y,z,group=world){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.8}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;group.add(m);return m}
function sphere(r,c,x,y,z,group=world){const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),new THREE.MeshStandardMaterial({color:c,roughness:.75}));m.position.set(x,y,z);m.castShadow=true;group.add(m);return m}

function makeCabin(){
 const g=new THREE.Group();g.position.set(-9,0,-30);world.add(g);
 box(7,4.5,5.5,0x8d5b36,0,2.25,0,g);
 const roof=new THREE.Mesh(new THREE.ConeGeometry(5.3,2.7,4),new THREE.MeshStandardMaterial({color:0x6b3e28,roughness:1}));
 roof.rotation.y=Math.PI/4;roof.position.y=5.8;roof.scale.z=1.02;roof.castShadow=true;g.add(roof);
 box(1.2,2.1,.25,0x50301f,0,.95,2.78,g);
 box(1.25,1.15,.22,0x8fd9e5,-2,2.7,2.78,g);box(1.25,1.15,.22,0x8fd9e5,2,2.7,2.78,g);
 box(.55,1.8,.7,0x633724,2.1,6.1,-.2,g);
}
makeCabin();

for(let i=0;i<70;i++){
 const x=(Math.random()-.5)*42, z=-45+Math.random()*50;
 if(Math.abs(x)<5) continue;
 const s=.5+Math.random()*1.4;
 const g=new THREE.Group();g.position.set(x,0,z);world.add(g);
 for(let j=0;j<3;j++){const h=.45+Math.random()*.55;box(.08,h,.08,0x6e9f43,(j-1)*.16,h/2,0,g)}
 if(i%3===0)sphere(.12, i%2?0xf5d64c:0xf29a8e, x*.0, .9, 0,g);
}

for(let i=0;i<34;i++){
 const x=(Math.random()-.5)*34, z=-5-Math.random()*38;
 const h=1+Math.random()*1.2;
 const g=new THREE.Group();g.position.set(x,0,z);world.add(g);
 for(let j=0;j<5;j++){const stem=box(.045,h,.045,0x4b8d3d,(j-2)*.08,h/2,0,g);stem.rotation.z=(j-2)*.08}
}

function makeEgg(){
 const g=new THREE.Group();g.position.set(0,.9,-5);g.visible=false;world.add(g);
 const egg=new THREE.Mesh(new THREE.SphereGeometry(1.05,32,24),new THREE.MeshStandardMaterial({color:0xfffaf0,roughness:.35,emissive:0xffc94d,emissiveIntensity:.08}));
 egg.scale.set(.82,1.18,.82);egg.castShadow=true;g.add(egg);
 const glow=new THREE.PointLight(0xffd76a,0,7);g.add(glow);
 for(let i=0;i<8;i++){const p=sphere(.045,0xffd76a,(Math.random()-.5)*1.5,1.4+Math.random()*.8,(Math.random()-.5)*1.5,g);p.userData.baseY=p.position.y}
 g.userData.glow=glow;g.userData.egg=egg;return g;
}
const egg=makeEgg();

function makeCharacter(name,color,hair){
 const g=new THREE.Group();g.visible=false;world.add(g);
 const body=box(1.0,1.5,.65,color,0,1.15,0,g);
 sphere(.62,0xffd0aa,0,2.35,0,g);sphere(.64,hair,0,2.72,-.02,g);
 const eyeMat=new THREE.MeshStandardMaterial({color:0x355c3d});
 const e1=new THREE.Mesh(new THREE.SphereGeometry(.07,12,8),eyeMat);e1.position.set(-.2,2.4,.56);g.add(e1);
 const e2=e1.clone();e2.position.x=.2;g.add(e2);
 box(.3,.85,1.0,0x6f4a31,-.27,.35,0,g);box(.3,.85,1.0,0x6f4a31,.27,.35,0,g);
 g.userData.name=name;return g;
}
const mike=makeCharacter('MIKE',0x777b83,0x704a35);
const micaela=makeCharacter('MICAELA',0xd86b8d,0x9a6a3c);
mike.position.set(-2,0,-7);micaela.position.set(2,0,-7);

const dialog=document.getElementById('dialogue'),speaker=document.getElementById('speaker'),text=document.getElementById('text');
const end=document.getElementById('end');
let t0=performance.now(),done=false;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function smooth(a,b,t){t=clamp(t,0,1);return a+(b-a)*(t*t*(3-2*t))}
function showDialog(s,tx){speaker.textContent=s;text.textContent=tx;dialog.style.opacity=1}
function hideDialog(){dialog.style.opacity=0}
function setCamera(x,y,z,lx,ly,lz){camera.position.set(x,y,z);camera.lookAt(lx,ly,lz)}

function timeline(now){
 if(done)return;
 const t=(now-t0)/1000;
 hideDialog();

 // ETAPA 1 0-5: valle, granja, sin personajes
 if(t<5){const p=t/5;setCamera(12,13,25-smooth(0,8,p),0,2,-20);mike.visible=false;micaela.visible=false;egg.visible=false}
 // ETAPA 2 5-12: camino
 else if(t<12){const p=(t-5)/7;setCamera(4,3.2,17-smooth(0,15,p),0,1,-20);mike.visible=false;micaela.visible=false;egg.visible=false}
 // ETAPA 3 12-18: desvío y revelación
 else if(t<18){const p=(t-12)/6;setCamera(4-smooth(0,4,p),3-smooth(0,1,p),2-smooth(0,2,p),0,1,-5);mike.visible=false;micaela.visible=false;egg.visible=p>.45}
 // ETAPA 4 18-25: huevo protagonista
 else if(t<25){const p=(t-18)/7;setCamera(0,2.8,3.8,0,1,-5);egg.visible=true;mike.visible=false;micaela.visible=false;
   egg.userData.glow.intensity=1.1+Math.sin(t*3)*.35;
   egg.userData.egg.emissiveIntensity=.12+Math.sin(t*2.2)*.05;
   egg.children.slice(1).forEach((p,i)=>{if(p.userData.baseY)p.position.y=p.userData.baseY+Math.sin(t*1.7+i)*.18})
 }
 // ETAPA 5 25-30: personajes aparecen SOLO ahora
 else if(t<30){const p=(t-25)/5;egg.visible=true;mike.visible=true;micaela.visible=true;
   mike.position.x=smooth(-4,-2,p);micaela.position.x=smooth(4,2,p);
   mike.position.z=micaela.position.z=-7+smooth(0,2,p);
   setCamera(0,3.1,5.5,0,1.7,-6);
 }
 // ETAPA 6 30-45: diálogo
 else if(t<45){egg.visible=true;mike.visible=true;micaela.visible=true;
   setCamera(0,3.1,5.5,0,1.7,-6);
   const q=t-30;
   if(q<3.4)showDialog('MICAELA','¿Qué hacemos aquí, Mike?');
   else if(q<6.5)showDialog('MIKE','No sé…');
   else if(q<8.2)hideDialog();
   else if(q<11.8)showDialog('MICAELA','Mira… eso…');
   else if(q<13.4)hideDialog();
   else if(q<16)showDialog('MIKE','¿Qué es eso?');
   else showDialog('MICAELA','No lo sé… pero vamos a averiguarlo.');
   egg.userData.glow.intensity=1.1+Math.sin(t*3)*.35;
 }
 // ETAPA 7
 else {end.style.opacity=1;end.style.pointerEvents='auto';done=true}
}

function animate(now){requestAnimationFrame(animate);timeline(now);renderer.render(scene,camera)}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();requestAnimationFrame(animate);

document.getElementById('skip').onclick=()=>{t0=performance.now()-45000;document.getElementById('skip').style.display='none'};
document.getElementById('continue').onclick=()=>location.href='rig/index.html';

// Ambiente suave sin archivos externos: viento/aves sintéticos y muy discretos.
let audioStarted=false;
function ambient(){
 if(audioStarted)return;audioStarted=true;
 try{
  const A=new AudioContext(), master=A.createGain();master.gain.value=.025;master.connect(A.destination);
  const osc=A.createOscillator(),gain=A.createGain();osc.type='sine';osc.frequency.value=180;gain.gain.value=.12;osc.connect(gain);gain.connect(master);osc.start();
 }catch(e){}
}
addEventListener('pointerdown',ambient,{once:true});
</script>
</body>
</html>
