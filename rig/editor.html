<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eggaro 3D Chicken & Rig Editor</title><link rel="stylesheet" href="./editor.css"></head>
<body><header><b>🐔 EGGARO · EDITOR 3D</b><span id="status">Listo</span></header>
<main><aside>
<section><h3>POLLO</h3><button id="newBtn">🐔 Nuevo pollo</button><label>Nombre<input id="name" value="Pollo Noob"></label></section>
<section><h3>FIGURAS</h3><div id="parts"></div></section>
<section><h3>SELECCIÓN</h3><select id="objects"></select><button id="duplicateBtn">📋 Duplicar</button><button id="deleteBtn">🗑️ Eliminar</button></section>
<section><h3>TRANSFORMAR PIEZA</h3><label>Pos X<input id="px" type="number" step=".05"></label><label>Pos Y<input id="py" type="number" step=".05"></label><label>Pos Z<input id="pz" type="number" step=".05"></label><label>Escala<input id="scale" type="number" step=".05" value="1"></label><label>Rot X<input id="ox" type="number" step="1"></label><label>Rot Y<input id="oy" type="number" step="1"></label><label>Rot Z<input id="oz" type="number" step="1"></label><input id="color" type="color" value="#f4c542"><button id="applyObj">✅ Aplicar pieza</button></section>
<section><h3>🦴 RIG REAL</h3><button id="autoRig">🪄 Crear rig automático</button><button id="bindRig">🔗 Vincular malla al rig</button><select id="bones"></select><label>Pos X<input id="bpx" type="number" step=".02"></label><label>Pos Y<input id="bpy" type="number" step=".02"></label><label>Pos Z<input id="bpz" type="number" step=".02"></label><label>Rot X<input id="bx" type="number" step="1"></label><label>Rot Y<input id="by" type="number" step="1"></label><label>Rot Z<input id="bz" type="number" step="1"></label><button id="applyBone">🦴 Aplicar hueso</button><button id="resetBone">↩️ Restaurar huesos</button><button id="toggleSkeleton">👁️ Esqueleto</button></section>
<section><h3>ARCHIVOS</h3><button id="loadMike">🐔 Cargar Mike nuevo</button><button id="loadMicaela">🐔 Cargar Micaela nueva</button><label class="file">📦 Cargar GLB desde dispositivo<input id="file" type="file" accept=".glb,model/gltf-binary"></label><button id="saveProject">💾 Guardar proyecto</button><label class="file">📂 Abrir proyecto<input id="projectFile" type="file" accept=".json"></label><button id="exportBtn">⬇️ Exportar GLB Draco</button></section>
<p>Las piezas se pueden seleccionar, mover, rotar, escalar, recolorear, duplicar y eliminar. El rig se exporta y Draco comprime la geometría.</p>
</aside><section id="view"></section></main><script type="module" src="./editor.js"></script></body></html>
