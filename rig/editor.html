<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eggaro Chicken Rig Editor</title><link rel="stylesheet" href="./editor.css"></head><body><header>🐔 <b>EGGARO 3D RIG & CHICKEN EDITOR</b><span id="status">Nuevo pollo</span></header><main><aside><button id="new">🐔 Nuevo pollo</button><label>Nombre<input id="name" value="Pollo Personalizado"></label><h3>Figuras</h3><div id="parts"></div><h3>Color</h3><input id="color" type="color" value="#f4c542"><h3>Hueso</h3><select id="bones"></select><label>Rot X<input id="rx" type="number" value="0"></label><label>Rot Y<input id="ry" type="number" value="0"></label><label>Rot Z<input id="rz" type="number" value="0"></label><button id="apply">Aplicar pose</button><button id="reset">Restaurar</button><label class="file">📦 Cargar GLB<input id="file" type="file" accept=".glb"></label><button id="skeleton">🦴 Esqueleto</button><button id="export">⬇️ Exportar GLB Draco</button><p>Construye pollos por piezas, ajusta el rig y exporta GLB con Draco.</p></aside><section id="view"></section></main><script type="module" src="./editor.js"></script></body></html>
